<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Our Story ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="landing">
<canvas id="fx" aria-hidden="true"></canvas>
<div class="curtain" aria-hidden="true"><span>♥</span></div>

<main class="hero">

  <!-- Edit the title and names below -->

    <span class="shine"></span><span class="heart-ico">♥</span> Open Our Gallery

  <p class="hint fade-late" style="--d:6.4s">♪ tap anywhere to begin the music</p>

<footer class="footer footer-abs">
  <span class="made">Made with love by <b>Tej Chinzah</b></span> <span class="heart" aria-hidden="true">♥</span>
